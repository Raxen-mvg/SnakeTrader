name: paper-trade

on:
  schedule:
    # Every 15 minutes, 09:15-15:30 IST (03:45-10:00 UTC), Monday-Friday.
    # GitHub may start scheduled runs a few minutes late; the engine checks the real time.
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Act even if the market is closed (testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tick
        run: python -m papertrade.engine ${{ inputs.force && '--force' || '' }}
      - name: Save state
        run: |
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
