name: probe-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Can a cloud runner reach the data sources?
        run: |
          python - <<'PY'
          import http.cookiejar, json, urllib.request, time
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          def fetch(url, op=None, headers=None):
              h = {"User-Agent": UA, "Accept": "*/*", "Accept-Language": "en-IN,en;q=0.9"}
              h.update(headers or {})
              req = urllib.request.Request(url, headers=h)
              t = time.time()
              try:
                  body = (op.open(req, timeout=25) if op else urllib.request.urlopen(req, timeout=25)).read()
                  return f"OK {len(body)} bytes {time.time()-t:.1f}s", body
              except Exception as e:
                  return f"FAIL {type(e).__name__}: {str(e)[:80]}", b""
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          home = "https://www.nseindia.com/companies-listing/corporate-filings-announcements"
          print("NSE home page:        ", fetch(home, op)[0])
          s, b = fetch("https://www.nseindia.com/api/corporate-announcements?index=equities", op, {"Referer": home})
          print("NSE announcements API:", s)
          s, b = fetch("https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=5d&interval=1d")
          print("Yahoo chart API:      ", s)
          s, b = fetch("https://archives.nseindia.com/content/historical/EQUITIES/2026/SEP/cm26SEP2026bhav.csv.zip")
          print("NSE bhavcopy archive: ", s)
          PY
